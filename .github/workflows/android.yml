name: Android checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and debug APK
        run: bash gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports/
            app/build/outputs/robolectric/
      - name: Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dayready-debug
          path: app/build/outputs/apk/debug/app-debug.apk
